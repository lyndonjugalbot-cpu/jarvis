<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.R.V.I.S.</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%2322d3ee' stroke-width='2'%3E%3Ccircle cx='16' cy='16' r='14'/%3E%3Ccircle cx='16' cy='16' r='9'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='4' fill='%2322d3ee'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="grid" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <header class="status-bar">
      <div class="wordmark">J.A.R.V.I.S.</div>
      <ul class="indicators">
        <li data-indicator="gestures" data-state="off">
          <span class="dot"></span><span class="label">Gestures</span><span class="value">off</span>
        </li>
        <li data-indicator="mic" data-state="off">
          <span class="dot"></span><span class="label">Mic</span><span class="value">off</span>
        </li>
        <li data-indicator="core" data-state="checking">
          <span class="dot"></span><span class="label">Core</span><span class="value">checking</span>
        </li>
        <li data-indicator="brain" data-state="off">
          <span class="dot"></span><span class="label">Brain</span><span class="value">not linked</span>
        </li>
      </ul>
      <time id="clock" class="clock"></time>
    </header>

    <main class="stage">
      <div class="orb" data-state="idle" aria-label="JARVIS is idle">
        <span class="ring r1"></span>
        <span class="ring r2"></span>
        <span class="ring r3"></span>
        <span class="core"></span>
      </div>
    </main>

    <footer class="transcript">
      <p class="line system">HUD shell online. Hand tracking and panels arrive in Phase 2.</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
