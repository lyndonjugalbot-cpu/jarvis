[project]
name = "jarvis-core"
version = "0.1.0"
description = "JARVIS core: brain, model router, tools, memory and voice"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.10",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "google-auth>=2.59.1",
    "google-auth-oauthlib>=1.5.0",
    "anthropic>=1.11.0",
    "ddgs>=9.16.0",
    "fastembed>=0.8.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"brain/prompt.py" = ["E501"]  # prompt prose: line breaks are part of the text
