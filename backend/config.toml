# JARVIS core settings. Secrets (tokens, API keys) go in .env, never here.

[core]
host = "127.0.0.1"   # never expose JARVIS beyond this machine
port = 8765
# Pages allowed to open the HUD WebSocket (the Vite dev server). The core's own address is always allowed.
hud_origins = ["http://127.0.0.1:5173", "http://localhost:5173"]
data_dir = "~/.jarvis"   # venv, logs, notes, tokens; kept out of iCloud-synced Documents

[user]
name = "Lyndon"
location = ""   # home for the weather; empty = the city in this computer's time zone

[brain]
history_turns = 20   # recent turns JARVIS keeps so it can switch providers without losing context

[providers]
# Tried in order; the first available provider answers. Later phases add
# "codex_plan" (ChatGPT plan), "local" (Ollama) and "paid_api" (capped Claude API).
order = ["claude_plan"]

[providers.claude_plan]
enabled = true
command = "claude"
model = ""                    # empty = Claude Code's default model; e.g. "sonnet" for faster replies
effort = ""                   # empty = default; "low" answers faster, "high" thinks harder
builtin_tools = ["WebSearch", "WebFetch"]
turn_timeout_s = 120
stall_timeout_s = 45          # no output for this long (outside JARVIS tool calls) counts as a failure

[tools]
confirm_timeout_s = 30        # no answer to a confirmation counts as "no"
file_roots = ["~/Documents", "~/Desktop", "~/Downloads"]   # the only folders JARVIS may search and read
# notes_dir = "~/Documents/Notes"   # default: <data_dir>/notes

[google]
# Your own OAuth client (docs/google-setup.md) and the saved sign-in. Both stay out of the repo.
# client_file = "~/.jarvis/google_client.json"
# token_file = "~/.jarvis/google_token.json"
