# JARVIS core settings. Secrets (tokens, API keys) go in .env, never here.

[core]
host = "127.0.0.1"   # never expose JARVIS beyond this machine
port = 8765
# Pages allowed to open the HUD WebSocket (the Vite dev server). The core's own address is always allowed.
hud_origins = ["http://127.0.0.1:5173", "http://localhost:5173"]
data_dir = "~/.jarvis"   # venv, logs, notes, tokens; kept out of iCloud-synced Documents

[user]
name = "Lyndon"
location = ""   # home for the weather; empty = the city in this computer's time zone

[brain]
history_turns = 20   # recent turns JARVIS keeps so it can switch providers without losing context

[providers]
# Tried in order; the first available provider answers. Plans you already pay for come first,
# then the free local model, then the capped pay-per-token API.
order = ["claude_plan", "codex_plan", "local", "paid_api"]

[providers.claude_plan]
enabled = true
command = "claude"
model = ""                    # empty = Claude Code's default model; e.g. "sonnet" for faster replies
effort = ""                   # empty = default; "low" answers faster, "high" thinks harder
builtin_tools = ["WebSearch", "WebFetch"]
turn_timeout_s = 120
stall_timeout_s = 45          # no output for this long (outside JARVIS tool calls) counts as a failure

[providers.codex_plan]
enabled = true
command = "codex"
model = ""                    # empty = Codex's default model for your ChatGPT plan
web_search = true
turn_timeout_s = 180
stall_timeout_s = 90

[providers.local]
enabled = true
host = "http://127.0.0.1:11434"
model = "qwen3:8b"            # free and private; needs `ollama pull qwen3:8b` (~5 GB)

[providers.paid_api]
enabled = true                # also needs ANTHROPIC_API_KEY in .env
model = "claude-opus-5-5"
effort = "low"                # low answers fastest and cheapest; medium/high think harder
max_tokens = 4096
monthly_cap_usd = 10          # set the same limit in the Anthropic Console as a backstop
fallback = "auto"             # auto: use when everything else is out | ask: ask once a day | off
input_usd_per_mtok = 4.0      # current price of the model above, to track spend against the cap
output_usd_per_mtok = 20.0

[memory]
enabled = true
embed_model = "BAAI/bge-small-en-v1.5"   # local embeddings, ~67 MB, downloaded once into ~/.jarvis/models
recall_k = 5                  # earlier exchanges, summaries and notes that go with each request
min_similarity = 0.65         # how close a memory must be to count (0-1); unrelated ones score under 0.6
resume_hours = 6              # after a restart, continue the last conversation if it's this recent

[voice]
enabled = true                # hands-free: "Hey Jarvis" in the core server (scripts/start.sh core)
wake_threshold = 0.5          # raise if it wakes by mistake, lower if it misses you
whisper_model = "base.en"     # speech to text; "small.en" is more accurate (~480 MB, slower)
tts = "piper"                 # piper (natural, local) | say (macOS built-in)
piper_voice = "en_GB-alan-medium"
say_voice = "Daniel"
input_device = ""             # empty = the system default microphone
output_device = ""            # empty = the system default speakers
silence_ms = 800              # this much quiet ends a request
max_listen_s = 15

[tools]
confirm_timeout_s = 30        # no answer to a confirmation counts as "no"
file_roots = ["~/Documents", "~/Desktop", "~/Downloads"]   # the only folders JARVIS may search and read
# notes_dir = "~/Documents/Notes"   # default: <data_dir>/notes

[google]
# Your own OAuth client (docs/google-setup.md) and the saved sign-in. Both stay out of the repo.
# client_file = "~/.jarvis/google_client.json"
# token_file = "~/.jarvis/google_token.json"
